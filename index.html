# Control-de-Pedidos-Invermar

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Piezas - Taller</title>
    <!-- Cargamos Tailwind CSS para un diseño moderno y rápido -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">⚙️ Registro de Piezas</h1>
        <p class="text-sm text-center text-gray-500 mb-6">Los datos se guardarán directamente en la base de datos de la empresa.</p>

        <!-- IMPORTANTE: Aquí pegarás el enlace de envío de tu Google Form -->
        <form id="formPiezas" action="AQUÍ_VA_TU_ENLACE_DE_GOOGLE_FORMS" method="POST" class="space-y-4">
            
            <!-- Selector de Cliente -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Cliente</label>
                <select name="AQUÍ_ID_CLIENTE" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">-- Selecciona un Cliente --</option>
                    <option value="Cliente Alfa S.A.">Cliente Alfa S.A.</option>
                    <option value="Industrias Beta">Industrias Beta</option>
                    <option value="Corporación Gamma">Corporación Gamma</option>
                </select>
            </div>

            <!-- Selector de Pieza -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Tipo de Pieza</label>
                <select name="AQUÍ_ID_PIEZA" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">-- Selecciona el tipo --</option>
                    <option value="Eje Central de 10mm">Eje Central de 10mm</option>
                    <option value="Engranaje de Bronce">Engranaje de Bronce</option>
                    <option value="Placa de Soporte">Placa de Soporte</option>
                </select>
            </div>

            <!-- Cantidad de Piezas -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Cantidad Producida</label>
                <input type="number" name="AQUÍ_ID_CANTIDAD" min="1" value="1" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Nombre del Operario -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Operario de Turno</label>
                <input type="text" name="AQUÍ_ID_OPERARIO" placeholder="Nombre completo" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Botón Grande de Envío -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg transition duration-200 text-lg cursor-pointer">
                💾 Registrar Producción
            </button>
        </form>
    </div>

</body>
</html>
